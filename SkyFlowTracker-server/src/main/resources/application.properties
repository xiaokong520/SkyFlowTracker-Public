# Public configuration. See PUBLICATION.md for local setup.
spring.application.name=SkyFlowTracker-server

#mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skyflowtracker}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:skyflowtracker}
spring.datasource.password=${DB_PASSWORD:}
#mybatis
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.skyflowtracker.pojo

logging.level.org.mybatis=INFO
logging.level.org.springframework.web=INFO
mybatis.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
#email
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtps}
#redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=40
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.lettuce.pool.time-between-eviction-runs=30s

jwt.filePath=${JWT_KEY_DIR:./secrets/jwt}

nginx.baseUrl=${NGINX_BASE_URL:http://localhost/SkyFlowTracker/}
nginx.basePath=${NGINX_BASE_PATH:./data/}

flask.baseUrl=${FLASK_BASE_URL:http://localhost:5000}

#Spring AI
spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.example.com}
spring.ai.openai.chat.options.model=${AI_MODEL:your-model-name}
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE:0.7}

baidu.appid=${BAIDU_APP_ID:}
baidu.apikey=${BAIDU_API_KEY:}
baidu.secretkey=${BAIDU_SECRET_KEY:}
# ??????
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

jwt.issuer=${JWT_ISSUER:skyflowtracker}
